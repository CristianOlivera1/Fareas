[project]
name = "fareas-api"
version = "0.1.0"
description = "Backend del sistema de asistencia con reconocimiento facial - Facultad de Informática UNAMBA"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "websockets==17.1",
    "python-multipart==0.0.20",
    "sqlmodel==0.0.24",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "pwdlib[argon2]==0.2.1",
    "pyjwt==2.10.1",
    "email-validator==2.3.0",
    "aiosmtplib==4.0.1",
    "apscheduler==3.10.4",
    "numpy==2.1.3",
    "opencv-python==4.10.0.84",
    "onnxruntime==1.20.1",
    "openpyxl==3.1.5",
    "reportlab==4.2.5",
    "pdfplumber==0.11.4",
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.8.4",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
