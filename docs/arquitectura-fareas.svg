  <!-- ===================== ENCABEZADO ===================== -->
  <text x="40" y="42" font-size="20" font-weight="700" letter-spacing="0.6" fill="#111111">ARQUITECTURA DEL SISTEMA FAREAS</text>
  <text x="40" y="63" font-size="11" fill="#6b7280">Control de asistencia con reconocimiento facial · UNAMBA · Angular 21 + FastAPI + PostgreSQL 17 + ONNX Runtime (CPU)</text>

  <!-- ===================== TÍTULOS DE COLUMNA ===================== -->
  <g font-size="12" font-weight="700" letter-spacing="1.6" text-anchor="middle" fill="#111111">
    <text x="145" y="100">CÁMARA IP</text>
    <text x="460" y="100">INFERENCIA (IA)</text>
    <text x="780" y="100">CORE BACKEND</text>
    <text x="1100" y="100">ALMACENAMIENTO</text>
  </g>

  <!-- ===================== CAJA A: CÁMARA ===================== -->
  <rect x="40" y="110" width="210" height="220" rx="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <g stroke="#111111" stroke-width="2" fill="none">
    <rect x="131" y="136" width="28" height="12" rx="4"/>
    <path d="M145,148 v12"/>
    <rect x="100" y="160" width="90" height="50" rx="15"/>
    <circle cx="145" cy="185" r="15"/>
  </g>
  <circle cx="145" cy="185" r="6.5" fill="#111111"/>
  <g font-size="9.5" fill="#6b7280" text-anchor="middle">
    <text x="145" y="234" font-size="11.5" font-weight="700" fill="#111111">Hikvision DS-2CD2347G3</text>
    <text x="145" y="252">4 MP · PoE+ · NEMA 4X</text>
    <text x="145" y="270">RTSP (sub-stream 102)</text>
    <text x="145" y="288">~2 fps por aula</text>
    <text x="145" y="306">1 cámara por aula</text>
  </g>

  <!-- flecha RTSP -->
  <path d="M250,220 H312" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#aSolid)"/>
  <text x="281" y="210" font-size="10" font-weight="600" text-anchor="middle" fill="#111111">RTSP</text>

