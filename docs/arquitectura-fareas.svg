  </g>

  <line x1="446" y1="145" x2="446" y2="205" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- malla facial (embedding) -->
  <g stroke="#111111" stroke-width="1.6" fill="none">
    <path d="M500,146 L523,158 L519,187 L500,201 L481,187 L477,158 Z"/>
    <path d="M500,146 L500,172 L523,158 M500,172 L519,187 M500,172 L481,187 M500,172 L477,158 M500,172 L500,201"/>
  </g>
  <g fill="#111111">
