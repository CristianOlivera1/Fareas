    <text x="500" y="222">ArcFace</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#6b7280">
    <text x="390" y="236">detección</text>
    <text x="500" y="236">512-d</text>
  </g>

  <g font-size="9.5" fill="#6b7280" text-anchor="middle">
    <text x="460" y="262" font-size="11" font-weight="700" fill="#111111">ONNX Runtime · CPU</text>
    <text x="460" y="280">alineación por 5 landmarks</text>
    <text x="460" y="298">embedding 512-d normalizado</text>
    <text x="460" y="316">umbral coseno 0.55 (RF-20)</text>
  </g>

  <!-- flecha in-process -->
  <path d="M600,220 H652" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#aSolid)"/>
  <text x="626" y="242" font-size="8" font-weight="600" text-anchor="middle" fill="#111111">mismo</text>
  <text x="626" y="253" font-size="8" font-weight="600" text-anchor="middle" fill="#111111">proceso</text>
  <text x="626" y="265" font-size="7.5" text-anchor="middle" fill="#6b7280">(sin red)</text>

