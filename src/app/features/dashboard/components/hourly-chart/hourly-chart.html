<div class="h-full rounded-xl border border-gray-200 bg-white p-4 shadow-xs sm:p-5">
  <div class="mb-3 flex items-center justify-between gap-2">
    <h2 class="text-base font-semibold tracking-tight text-gray-900">Asistencia por hora (hoy)</h2>
    <p-select
      [options]="periodOptions()"
      [ngModel]="period()"
      (ngModelChange)="period.set($event)"
      aria-label="Período"
      class="w-28"
    />
  </div>
  <div class="h-64 sm:h-72">
    <canvas #chart></canvas>
  </div>
</div>
