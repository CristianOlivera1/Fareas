<section class="space-y-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-xl font-semibold tracking-tight text-gray-900">Asistencias</h1>
      <p class="mt-1 text-sm text-gray-500">Listado estático con mocks — sin conexión al backend.</p>
    </div>
    <div class="flex flex-col sm:flex-row gap-2">
      <label class="relative">
        <span class="sr-only">Buscar</span>
        <iconify-icon
          icon="material-symbols:search"
          width="18"
          class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
        />
        <input
          [ngModel]="query()"
          (ngModelChange)="query.set($event)"
          type="search"
          placeholder="Buscar por nombre, ID o área…"
          class="w-full sm:w-64 rounded-lg border border-gray-200 bg-white py-2 pl-9 pr-3 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-(--fareas-primary)"
        />
      </label>
      <p-select
        [options]="statusOptions()"
        [ngModel]="statusFilter()"
        (ngModelChange)="statusFilter.set($event)"
        placeholder="Estado"
        aria-label="Filtrar por estado"
        class="w-full sm:w-44"
      />
    </div>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="filtered()"
    [trackBy]="trackById"
    [showClearFilters]="true"
    (clearFilters)="clearFilters()"
    emptyTitle="Sin asistencias"
    emptyMessage="No hay registros para los filtros actuales."
  >
    <ng-template appCell="method" let-row>
      <span class="inline-flex items-center gap-1.5 text-sm text-gray-700">
        <iconify-icon
          [icon]="row.method === 'Facial' ? 'material-symbols:face-outline' : 'material-symbols:edit-outline'"
          width="16"
          class="text-gray-400"
        />
        {{ row.method }}
      </span>
    </ng-template>
    <ng-template appCell="status" let-row>
      <p-tag [value]="row.status" [severity]="statusSeverity(row.status)" />
    </ng-template>
  </app-data-table>
</section>
