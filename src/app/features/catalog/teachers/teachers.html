<app-page-header title="Docentes" subtitle="Alta de docentes con envío de clave temporal (RF-02, RF-08)">
  @if (auth.isAdmin()) {
    <app-ui-button icon="material-symbols:person-add" (click)="openCreate()">
      Nuevo docente
    </app-ui-button>
  }
</app-page-header>

<div class="mb-4 flex flex-wrap items-center gap-3">
  <app-ui-input class="w-full sm:w-72" icon="material-symbols:search" placeholder="Buscar por nombre o correo…"
    [ngModel]="q()" (ngModelChange)="onSearch($event)" />
  <app-ui-button variant="ghost" size="sm" icon="material-symbols:refresh" (click)="reload()">
    Actualizar
  </app-ui-button>
</div>

@if (error(); as msg) {
  <app-ui-alert variant="danger" title="No se pudieron cargar los docentes" class="mb-4 block">{{ msg }}</app-ui-alert>
}

<app-data-table
  [columns]="columns" [data]="people()" mode="server"
  [serverPage]="page()" [serverTotal]="total()" [serverPageSize]="pageSize()"
  [loading]="loading()" [errorMessage]="error()"
  emptyTitle="Sin docentes" emptyMessage="Registra al primer docente de la facultad."
  emptyIcon="material-symbols:person-outline"
  (pageChange)="onPage($event)" (perPageChange)="onPageSize($event)" (retry)="reload()"
>
  <ng-template appCell="email" let-p>
    <span class="text-sm text-gray-600">{{ p.email }}</span>
  </ng-template>
  <ng-template appCell="is_active" let-p>
    @if (p.is_active) {
      <span class="inline-flex items-center gap-1 rounded-full bg-green-50 px-2 py-0.5 text-xs font-medium text-green-700">
        <span class="size-1.5 rounded-full bg-green-500"></span> Activo
      </span>
    } @else {
      <span class="inline-flex items-center gap-1 rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-500">
        <span class="size-1.5 rounded-full bg-gray-400"></span> Inactivo
      </span>
    }
  </ng-template>
  <ng-template appCell="actions" let-p>
    <div class="flex items-center justify-center gap-1">
      <button type="button"
        class="grid size-8 place-items-center rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-colors"
        title="Editar" (click)="openEdit(p)">
        <iconify-icon icon="material-symbols:edit-outline" width="18"></iconify-icon>
      </button>
      <button type="button"
        class="grid size-8 place-items-center rounded-lg text-gray-500 hover:bg-blue-50 hover:text-(--fareas-primary) transition-colors disabled:opacity-40"
        [disabled]="resendingId() === p.id"
        title="Reenviar clave temporal por correo (RF-08)" (click)="resend(p)">
        @if (resendingId() === p.id) {
          <iconify-icon icon="svg-spinners:180-ring-with-bg" width="16"></iconify-icon>
        } @else {
          <iconify-icon icon="material-symbols:mark-email-unread-outline" width="18"></iconify-icon>
        }
      </button>
    </div>
  </ng-template>
</app-data-table>

<p-dialog [header]="isEditing() ? 'Editar docente' : 'Nuevo docente'"
  [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '440px' }">
  <div class="space-y-4 pt-2" [formGroup]="teacherForm">
    <app-ui-input formControlName="full_name" label="Nombre completo" [required]="true"
      placeholder="Aquino Cruz, Mario (Mag.)" autocomplete="name" [maxlength]="160"
      [error]="fieldError('full_name')" />
    @if (!isEditing()) {
      <app-ui-input formControlName="email" label="Correo institucional" [required]="true"
        type="email" placeholder="mario.aquino@unamba.edu.pe" icon="material-symbols:mail-outline"
        inputmode="email" autocomplete="email" [maxlength]="160" [error]="fieldError('email')" />
      <app-ui-input formControlName="dni" label="DNI" [required]="true" placeholder="8 dígitos"
        inputmode="numeric" autocomplete="off" [maxlength]="8" [error]="fieldError('dni')" />
    }
    <app-ui-input formControlName="whatsapp" label="WhatsApp" placeholder="+51 983 000 000"
      type="tel" inputmode="tel" autocomplete="tel" [maxlength]="15"
      [error]="fieldError('whatsapp')" hint="Opcional. 9 dígitos, empieza con 9. Acepta +51." />
    @if (isEditing()) {
      <label class="flex items-center gap-2 pt-1">
        <p-toggleswitch formControlName="is_active" />
        <span class="text-sm text-gray-700">Cuenta activa</span>
      </label>
    } @else {
      <app-ui-alert variant="info" [inline]="true" icon="material-symbols:info-outline">
        Al guardar se genera una clave temporal y se envía al correo (RF-08).
      </app-ui-alert>
    }
  </div>
  <ng-template pTemplate="footer">
    <app-ui-button variant="ghost" (click)="dialogVisible = false">Cancelar</app-ui-button>
    <app-ui-button [loading]="saving()" [disabled]="saving()" (click)="save()">Guardar</app-ui-button>
  </ng-template>
</p-dialog>
