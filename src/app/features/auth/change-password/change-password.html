      <div class="mb-8">
        <span class="text-2xl font-semibold tracking-tight text-gray-900">
          Fareas<span class="text-(--fareas-primary)">.</span>
        </span>
        <h1 class="mt-4 text-3xl font-bold tracking-tight text-gray-900">Cambiar contraseña</h1>
        @if (isForced()) {
        <div
          class="mt-3 flex items-start gap-2.5 bg-amber-50 border border-amber-200 rounded-lg p-3 animate-[fadeIn_0.25s_ease-out]">
          <iconify-icon icon="material-symbols:warning-outline-rounded" width="18"
            class="text-amber-500 mt-0.5 shrink-0" />
          <span class="text-sm text-amber-700">
            Tu contraseña es temporal. Debes cambiarla antes de continuar.
          </span>
        </div>
        } @else {
        <p class="mt-2 text-sm text-gray-500">
          Actualiza tu contraseña para mantener tu cuenta segura.
        </p>
        }
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
        @if (errorMessage()) {
        <div
          class="flex items-start gap-2.5 bg-red-50 border border-red-200 rounded-lg p-3 animate-[fadeIn_0.25s_ease-out]">
          <iconify-icon icon="material-symbols:error-outline" width="18" class="text-red-500 mt-0.5 shrink-0" />
          <span class="text-sm text-red-600">{{ errorMessage() }}</span>
        </div>
        }

        <app-ui-input formControlName="current_password" label="Contraseña actual" type="password"
          icon="material-symbols:lock-outline" placeholder="••••••••" autocomplete="current-password"
          [showPasswordToggle]="true" [error]="fieldError('current_password')" />

        <app-ui-input formControlName="new_password" label="Nueva contraseña" type="password"
          icon="material-symbols:lock-reset" placeholder="Mínimo 8 caracteres" autocomplete="new-password"
          [showPasswordToggle]="true" [error]="fieldError('new_password')"
          hint="Usa al menos 8 caracteres con letras y números." />

        <app-ui-input formControlName="confirm_password" label="Confirmar nueva contraseña" type="password"
          icon="material-symbols:lock-check-outline" placeholder="Repite la nueva contraseña"
          autocomplete="new-password" [showPasswordToggle]="true" [error]="fieldError('confirm_password')" />

        <app-ui-button type="submit" variant="primary" [fullWidth]="true" [loading]="isSubmitting()"
          [disabled]="form.invalid || isSubmitting()">
          @if (isSubmitting()) {
          Actualizando...
          } @else {
          Actualizar contraseña
          }
        </app-ui-button>
      </form>
