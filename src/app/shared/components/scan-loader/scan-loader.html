<div class="scan-loader" role="status" aria-live="polite">
  <span class="scan-loader__visual" aria-hidden="true">
    <span class="scan-loader__document scan-loader__document--base"></span>
    <span class="scan-loader__document scan-loader__document--active"></span>
    <span class="scan-loader__beam"></span>
  </span>
  <span class="scan-loader__label">{{ label() }}</span>
</div>
