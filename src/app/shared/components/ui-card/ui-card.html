<div
  class="group relative overflow-hidden rounded-lg border border-gray-200 bg-white p-6 transition-all duration-200 hover:border-gray-300 hover:shadow-sm"
>
  <div class="flex items-center justify-between">
    <p class="text-sm font-medium tracking-tight text-gray-500">{{ title() }}</p>
    <iconify-icon [icon]="icon()" width="18" [class]="'text-gray-400 transition-colors group-hover:text-gray-900 ' + accent()" />
  </div>
  <div class="mt-4">
    <p class="text-3xl font-semibold tracking-tight text-gray-900">{{ value() }}</p>
    <p class="mt-1 text-xs text-gray-400 font-medium">{{ detail() }}</p>
  </div>
</div>
